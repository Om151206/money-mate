services:
  - type: web
    name: money-mate
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Add DATABASE_URL, or DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, and DB_NAME
      # in the Render dashboard. Set MYSQL_SSL=true if required by your provider.
